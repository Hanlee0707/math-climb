<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="sprout-completion-mode" content="manual">
<meta name="sprout-web-sites" content="https://read-along-eight.vercel.app">
<title>Math Climb</title>
<!--
  Math Climb: a placement climb. Rounds of five questions; four or five right moves the kid up a rung
  (Pre-K to Grade 5), two or fewer moves down, three stays. Every wrong choice carries a Learning Commons
  misconception tag so the feedback names the trap, and "Show me" draws the working while Sprout's voice
  explains. Between rounds the canvas pings a hop that wakes a Claude routine; the routine reads the
  session from the canvas db, walks the Learning Commons progression map, and may write the next round
  (`coach/next`) plus a grown-up report (`placement`). Sprout moves (`sprout.actions`) let the live
  Sprout read, hint, explain, start and finish.
  Data: data/users/<self>/profile {level}, data/users/<self>/sessions/<sid>, .../coach/next, data/users/<self>/placement.
-->
<style>
:root{--ink:#23203a;--soft:#6f6a86;--paper:#fff8ee;--card:#ffffff;--coral:#ff6b4a;--coralD:#e4502f;--teal:#1fb6a6;--tealD:#15938a;--sun:#ffc93c;--sky:#cfeefb;--grass:#bfe8c8;--line:#eee4d4;--ok:#1fb6a6;--bad:#ff6b4a;--r:24px}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;overflow-x:clip}
body{font-family:-apple-system,"SF Pro Rounded",system-ui,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);-webkit-tap-highlight-color:transparent;font-size:17px;line-height:1.35}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(800px 420px at 15% -10%,#ffe9c2 0,transparent 60%),radial-gradient(700px 460px at 110% 10%,#d6f3ef 0,transparent 60%)}
main{max-width:560px;margin:0 auto;padding:calc(10px + var(--canvas-safe-top,0px)) 16px 120px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:10px;padding-left:56px;min-height:44px}
.top h1{font-size:22px;margin:0;font-weight:900;letter-spacing:-.01em;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;background:#fff;border:2px solid var(--ink);white-space:nowrap}
.pill.lvl{background:var(--sun)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.icon{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--ink);font-size:20px;display:grid;place-items:center}
.icon[aria-pressed=false]{opacity:.45}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 10px 30px rgba(35,32,58,.08)}
.k{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
h2{font-size:26px;line-height:1.15;margin:0;font-weight:900;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--soft);font-weight:600}
.big{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border-radius:999px;padding:18px 20px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--coral),var(--coralD));box-shadow:0 10px 22px rgba(255,107,74,.35)}
.big:active{transform:translateY(2px)}
.big.teal{background:linear-gradient(135deg,var(--teal),var(--tealD));box-shadow:0 10px 22px rgba(31,182,166,.35)}
.big:disabled{opacity:.5;pointer-events:none}
.ghost{border-radius:999px;padding:12px 18px;font-weight:800;border:2px solid var(--ink);background:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.status{color:var(--soft);font-size:14px;min-height:1.2em;margin:0}

/* the climb */
.climb{position:relative;padding:10px 6px 0}
#hill{width:100%;height:auto;display:block;overflow:visible}
.rung{font-weight:800;font-size:11px;fill:var(--ink)}
.rung.off{opacity:.45}
.flagtxt{font-weight:900;font-size:12px;fill:#fff}
.lvls{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.lv{border-radius:14px;padding:7px 2px;text-align:center;font-weight:800;font-size:11px;background:#fff;border:2px solid var(--line);white-space:nowrap;overflow:hidden}
.lv.done{border-color:var(--teal);background:#e6f8f5}
.lv.here{border-color:var(--ink);background:var(--sun)}
.lv small{display:block;font-size:9px;color:var(--soft);font-weight:700}

/* play */
.head{position:sticky;top:var(--canvas-safe-top,0px);z-index:10;background:var(--paper);margin:0 -16px;padding:8px 16px 10px;border-bottom:2px solid var(--line)}
.dots{display:flex;gap:8px;justify-content:center;margin-top:8px}
.dots i{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:block}
.dots i.ok{background:var(--teal)}.dots i.bad{background:var(--coral)}.dots i.now{background:var(--sun)}
.q{min-height:88px}
.q p{font-size:24px;font-weight:800;margin:0;line-height:1.25}
.q p.eq{font-size:40px;font-weight:900;letter-spacing:.02em;font-variant-numeric:tabular-nums;text-align:center}
.pic{margin-top:12px;background:#fffdf7;border-radius:18px;padding:10px;border:2px dashed var(--line)}
.pic svg{width:100%;height:auto;display:block;overflow:visible}
.d{transition:opacity .25s,transform .25s}
.d.dim{opacity:.18}
.d.lit{transform:scale(1.18)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices.one{grid-template-columns:1fr}
.ch{border-radius:20px;padding:18px 12px;font-size:30px;font-weight:900;background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);min-height:76px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.ch.txt{font-size:20px}
.ch:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.ch.ok{background:#e6f8f5;border-color:var(--teal);box-shadow:4px 4px 0 var(--teal)}
.ch.bad{background:#ffece7;border-color:var(--coral);box-shadow:4px 4px 0 var(--coral)}
.ch.mute{opacity:.4;pointer-events:none}
.ch:disabled{pointer-events:none}
.fb{display:flex;flex-direction:column;gap:12px}
.fb .line{font-size:20px;font-weight:800}
.fb .trap{font-size:16px;font-weight:600;color:var(--soft)}
.sprout{display:flex;gap:10px;align-items:flex-start}
.sprout .face{width:44px;height:44px;border-radius:50%;flex:none;background:linear-gradient(145deg,#8ee0b1,#1fb6a6);display:grid;place-items:center;font-size:22px}
.sprout .say{background:#f1fbf9;border-radius:18px;padding:12px 14px;font-weight:700;flex:1}
.hintbox{background:#fff6dc;border-radius:18px;padding:12px 14px;font-weight:700}

/* sheets */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(35,32,58,.45);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.sheet .in{background:var(--card);border-radius:28px;padding:22px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.score{font-size:52px;font-weight:900;line-height:1;text-align:center}
.score small{font-size:18px;color:var(--soft);font-weight:800}
.verdict{text-align:center;font-size:22px;font-weight:900}
.list{display:flex;flex-direction:column;gap:8px}
.list div{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.list b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:#fff;background:var(--teal)}
.list b.next{background:var(--sun);color:var(--ink)}
.report{font-size:14px;color:var(--soft);font-weight:600;white-space:pre-wrap}
.map{margin-top:10px}.map svg{width:100%;height:auto;display:block;overflow:visible}.map .nm{font-size:9px;font-weight:700;fill:#23203a}.map .cd{font-size:8px;font-weight:800;fill:#6f6a86}.map .gl{font-size:11px;font-weight:900;fill:#6f6a86}
.legend{font-size:12px;color:var(--soft);font-weight:700;margin:6px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);vertical-align:-2px;margin-right:3px}.legend .met{background:var(--teal)}.legend .mixed{background:var(--sun)}.legend .missed{background:var(--coral)}.legend .near{background:#fff;border-style:dashed}
@media (max-width:380px){.ch{font-size:26px;padding:14px 8px}.q p{font-size:21px}.lvls{gap:4px}.lv{font-size:11px}}
@media (prefers-reduced-motion:reduce){.d{transition:none}}
</style></head><body>
<main id="main">

<section id="home">
  <div class="top"><h1>Math Climb</h1><span class="pill lvl" id="homeLvl">Pre-K</span></div>
  <div class="card climb">
    <svg id="hill" viewBox="0 0 560 230" role="img" aria-label="A hill with seven rungs from Pre-K to Grade 5 and a flag at the rung you are on"></svg>
    <div class="lvls" id="lvls"></div>
  </div>
  <div class="card" id="lastCard" hidden>
    <span class="k">Last climb</span>
    <h2 id="lastTitle"></h2>
    <p class="sub" id="lastSub"></p>
    <div class="map" id="homeMap"></div>
  </div>
  <div class="card">
    <h2 id="homeH">Ready to climb?</h2>
    <p class="sub">Five questions a round. Get most of them and we climb higher. Tap the speaker any time to hear a question again.</p>
    <div class="row" style="margin-top:12px">
      <button class="big" type="button" id="bStart">Start climbing</button>
    </div>
    <p class="status" id="homeStatus"></p>
  </div>
</section>

<section id="play" hidden>
  <div class="head">
    <div class="top" style="padding-left:56px">
      <span class="pill lvl" id="playLvl"></span>
      <span class="pill" id="playRound"></span>
      <span style="flex:1"></span>
      <button class="icon" type="button" id="bSpeak" aria-label="Hear the question again">🔊</button>
      <button class="icon" type="button" id="bVoice" aria-label="Voice on or off" aria-pressed="true">🗣️</button>
    </div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="card q" id="qCard">
    <p id="qText"></p>
    <div class="pic" id="pic" hidden></div>
  </div>
  <div class="choices" id="choices"></div>
  <div class="card fb" id="fb" hidden>
    <div class="line" id="fbLine"></div>
    <div class="trap" id="fbTrap" hidden></div>
    <div class="sprout" id="fbSay" hidden><div class="face">🌱</div><div class="say" id="fbSayText"></div></div>
    <div class="row">
      <button class="ghost" type="button" id="bShow">Show me</button>
      <button class="big teal" type="button" id="bNext" style="flex:1;width:auto">Next</button>
    </div>
  </div>
  <div class="hintbox" id="hint" hidden></div>
  <div class="row" id="helpRow"><button class="ghost" type="button" id="bHint">Give me a hint</button></div>
</section>

</main>

<div class="sheet" id="roundSheet" hidden><div class="in" role="dialog" aria-label="Round finished">
  <span class="k" id="rsK">Round 1</span>
  <div class="score" id="rsScore"></div>
  <div class="verdict" id="rsVerdict"></div>
  <div class="sprout" id="rsCoach" hidden><div class="face">🌱</div><div class="say" id="rsCoachText"></div></div>
  <button class="big" type="button" id="bRoundGo">Keep going</button>
</div></div>

<div class="sheet" id="finSheet" hidden><div class="in" role="dialog" aria-label="Climb finished">
  <span class="k">Your rung</span>
  <h2 id="finTitle"></h2>
  <p class="sub" id="finSub"></p>
  <div class="list" id="finList"></div>
  <div class="map"><span class="k">Your map</span><div id="finMap"></div><p class="legend"><i class="met"></i>got it <i class="mixed"></i>some <i class="missed"></i>not yet <i class="near"></i>nearby</p></div>
  <div class="sprout" id="finCoach" hidden><div class="face">🌱</div><div class="say" id="finCoachText"></div></div>
  <details><summary class="k" style="cursor:pointer">For grown-ups</summary><p class="report" id="finReport"></p><div class="map"><span class="k">The whole map</span><div id="finMapAll"></div></div></details>
  <button class="big" type="button" id="bDone">Done</button>
</div></div>

<script>

function mk(o){

    const tt = document.createElementNS(NS, 'title'); tt.textContent = c + ': ' + (STD_NAME[c] || nodes[c].n); dot.append(tt);
    if (all && st) s.append(txt(c, x, y + r + 8, 7, { class: 'cd' }));
    if (!all){ const nm = (STD_NAME[c] || nodes[c].n); const lim = all ? 18 : Math.max(12, Math.floor(colW / 5.6)); const words = nm.length > lim ? [nm.slice(0, lim).replace(/\s+\S*$/, ''), nm.slice(nm.slice(0, lim).replace(/\s+\S*$/, '').length).trim()] : [nm]; words.slice(0, all ? 1 : 2).forEach((w, k) => s.append(txt(w.length > lim ? w.slice(0, lim - 1) + '…' : w, x, y + r + 9 + k * 10, all ? 8 : 9, { class: 'nm' }))); }
  }
  if (place != null){ const ci = cols.indexOf(placeGrade(place)); if (ci >= 0){ const x = colW * ci + colW / 2; const fy = all ? 24 : H - 2; const f = document.createElementNS(NS, 'path'); f.setAttribute('d', `M${x - 22} ${fy} l0 -18 l30 7 l-30 7`); f.setAttribute('fill', '#ff6b4a'); s.append(f); s.append(txt('YOU', x - 7, fy - 11, 8, { class: 'flagtxt' })); } }
  el.innerHTML = ''; el.append(s);
}
const placeGrade = level => level <= 1 ? 0 : level - 1;

/* ---------- finish ---------- */
function summarize(place){
  const can = [], next = [], seen = new Set();
  for (const r of S.rounds) for (const a of r.items){ const nm = STD_NAME[a.std] || a.std; if (seen.has(nm + a.ok)) continue; seen.add(nm + a.ok); (a.ok ? can : next).push(nm); }
  const nextUp = next.filter(x => !can.includes(x)); const upStds = LEVELS[Math.min(LEVELS.length - 1, place + 1)].stds.map(s => STD_NAME[s] || s);
  const rank = nm => { const i = Object.keys(STD_NAME).findIndex(k => STD_NAME[k] === nm); return i < 0 ? -1 : i; };
  return { can: [...new Set(can)].sort((a, b) => rank(b) - rank(a)).slice(0, 5), next: (nextUp.length ? nextUp : upStds).slice(0, 4) };
}
function finish(place, coachPlacement){
  const L = LEVELS[place]; const sum = summarize(place);
  const p = coachPlacement ? Object.assign({ level: place, label: L.label, at: nowIso() }, coachPlacement, { can: coachPlacement.can || sum.can, next: coachPlacement.next || sum.next }) : { level: place, label: L.label, at: nowIso(), can: sum.can, next: sum.next, note: null, report: null, by: 'ladder' };
  S.placement = p; S.done = true; S.cur = null; S.level = place; saveSession(true);
  if (db){ try { db.doc(`data/users/${self}/placement`).set(p).catch(() => {}); db.doc(`data/users/${self}/profile`).set({ level: place, updatedAt: nowIso() }).catch(() => {}); } catch {} }
  $('finTitle').textContent = `${L.label === 'K' ? 'Kindergarten' : L.label.replace('Gr ', 'Grade ')} rung`;
  $('finSub').textContent = `${S.rounds.length} round${S.rounds.length === 1 ? '' : 's'}, ${S.rounds.reduce((s, r) => s + r.score, 0)} right out of ${S.rounds.reduce((s, r) => s + r.of, 0)}.`;
  $('finList').innerHTML = p.can.map(x => `<div><b>✓</b><span>${esc(x)}</span></div>`).join('') + p.next.map(x => `<div><b class="next">→</b><span>Next: ${esc(x)}</span></div>`).join('');
  if (p.note){ $('finCoachText').textContent = p.note; $('finCoach').hidden = false; } else $('finCoach').hidden = true;
  p.states = climbStates(); S.placement = p;
  drawMap($('finMap'), Object.assign({}, p.states), place, p.graph || null, false);
  drawMap($('finMapAll'), Object.assign({}, p.states), place, p.graph || null, true);
  $('finReport').textContent = p.report || S.rounds.map(r => `Round ${S.rounds.indexOf(r) + 1} at ${LEVELS[r.level].label}: ${r.score}/${r.of}` + (r.items.filter(a => !a.ok && a.tag).length ? ` (traps: ${[...new Set(r.items.filter(a => !a.ok && a.tag).map(a => a.tag))].join(', ')})` : '')).join('\n') + `\nStandards met: ${[...new Set(S.rounds.flatMap(r => r.items.filter(a => a.ok).map(a => a.std)))].join(', ') || 'none yet'}.`;
  $('play').hidden = true; $('home').hidden = false; renderHome(); $('finSheet').hidden = false;
  say(p.note || `You climbed to the ${L.say} rung. ${p.can.length ? 'You can do ' + p.can.slice(0, 2).join(' and ') + '.' : ''}`);
}
$('bDone').onclick = () => {
  $('finSheet').hidden = true;
  const p = S.placement; const summary = p ? `Math Climb: ${p.label} rung after ${S.rounds.length} round${S.rounds.length === 1 ? '' : 's'}. Can: ${p.can.join(', ') || 'warming up'}. Next: ${p.next.join(', ')}.` : 'Math Climb finished';
  if (hasSprout && typeof sprout.complete === 'function'){ try { sprout.complete({ summary }); } catch {} }
  $('bStart').disabled = true; $('homeStatus').textContent = 'All done for today.';
};
$('bStart').onclick = startClimb;
if (hasSprout && typeof sprout.onBackPress === 'function') sprout.onBackPress(() => { if (!$('finSheet').hidden){ return true; } if (!$('roundSheet').hidden) return true; if ($('play').hidden) return false; $('play').hidden = true; $('home').hidden = false; renderHome(); return true; });

/* ---------- Sprout moves: the live Sprout can read, hint, explain, start and finish ---------- */
function registerMoves(){
  if (!hasSprout || !sprout.actions || typeof sprout.actions.register !== 'function') return;
  const here = () => { const it = curItem(); return { screen: $('play').hidden ? 'home' : 'play', level: LEVELS[S.cur ? S.cur.level : S.level].label, round: S.rounds.length + (S.cur ? 1 : 0), question: it ? it.text : null, choices: it ? it.choices.map(c => c.v) : null, answered: !!(it && S.cur.answers[S.cur.i]), lastScores: S.rounds.map(r => `${LEVELS[r.level].label} ${r.score}/${r.of}`) }; };
  const reg = (name, description, props, fn) => { try { sprout.actions.register(name, { description, inputSchema: { type: 'object', properties: props || {} } }, fn); } catch {} };
  reg('where_are_we', 'Where the climb is: screen, rung, round, the question on screen and its choices. Call before helping.', null, here);
  reg('read_question', 'Read the question on screen aloud again, in the canvas voice. Returns the question text.', null, () => { const it = curItem(); if (!it) return { ok: false, reason: 'no question on screen' }; say(it.say || it.text); return { question: it.text, choices: it.choices.map(c => c.v) }; });
  reg('give_hint', 'Show and speak the hint for the question on screen. Returns the hint so you can say it your own way. Never gives the answer.', null, () => { const it = curItem(); if (!it || S.cur.answers[S.cur.i]) return { ok: false, reason: 'nothing to hint' }; $('bHint').click(); return { hint: it.hint, skill: it.lc || STD_NAME[it.std] || it.std }; });
  reg('explain_question', 'After the kid answered: draw the working on screen and return the right answer, what the kid picked, the trap behind a wrong pick (a Learning Commons misconception) and the skill, so you can explain it in your own words.', null, () => { const it = curItem(); if (!it) return { ok: false, reason: 'no question on screen' }; const a = S.cur.answers[S.cur.i]; if (!a) return { ok: false, reason: 'not answered yet; use give_hint' }; showMe(); return { question: it.text, answer: it.ans, picked: a.picked, correct: a.ok, trap: a.tag ? { tag: a.tag, inKidWords: TRAP[a.tag] || null } : null, skill: it.lc || STD_NAME[it.std] || it.std, standard: it.std, working: it.why }; });
  reg('next_question', 'Move on after the kid has answered and heard the feedback.', null, () => { if (!S.cur || !S.cur.answers[S.cur.i]) return { ok: false, reason: 'not answered yet' }; next(); return here(); });
  reg('start_climbing', 'Start or resume the climb from the home screen.', null, () => { if (!$('play').hidden) return { ok: false, reason: 'already climbing' }; if ($('bStart').disabled) return { ok: false, reason: 'finished for today' }; startClimb(); return here(); });
  reg('keep_going', 'Close the end-of-round sheet and begin the next round.', null, () => { if ($('roundSheet').hidden) return { ok: false, reason: 'no round sheet open' }; $('bRoundGo').click(); return here(); });
  reg('finish_climb', 'Finish the whole climb now and place the kid on the best rung so far.', null, () => { if (S.done) return { ok: false, reason: 'already finished' }; if (S.cur && S.cur.answers.length){ const r = S.cur; S.rounds.push({ level: r.level, score: r.answers.filter(a => a.ok).length, of: r.answers.length, source: r.source, items: r.answers.filter(Boolean), note: r.note }); } S.cur = null; $('roundSheet').hidden = true; const pm = passedMap(); let best = -1; for (const k in pm) if (pm[k]) best = Math.max(best, +k); finish(best >= 0 ? best : S.level); return { placed: S.placement.label, can: S.placement.can, next: S.placement.next }; });
}

/* ---------- boot ---------- */
(async () => {
  const hold = hasSprout && sprout.loading && typeof sprout.loading.begin === 'function' ? sprout.loading.begin('Finding your rung') : null;
  try { await openDb(); } finally { try { hold && hold.ready(); } catch {} }
  registerMoves(); renderHome();
  if (S.cur && !S.done) startClimb();
})();
</script></body></html>
